name: Release

on:
  push:
    tags: ['v*', '[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ !contains(github.ref_name, '-updates-') }}
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json")).version; const tag = process.env.RELEASE_TAG; if (tag !== version && tag !== `v${version}` && !(tag.startsWith(`v${version}-windows-preview.`) && /^\d{8}$/.test(tag.slice(`v${version}-windows-preview.`.length)))) throw new Error("Tag must match Tauri version or its dated Windows preview");'
          test -f "releases/$RELEASE_TAG.md"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-installer
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: linux-desktop
          path: linux-assets
      - name: Verify installer checksum
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Verify Linux package checksums
        working-directory: linux-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Add Linux packages to release assets
        run: |
          cp linux-assets/appimage/*.AppImage linux-assets/deb/*.deb release-assets/
          cp linux-assets/build-info.json release-assets/build-info-linux.json
          sed -E 's#  (appimage|deb)/#  #' linux-assets/SHA256SUMS.txt > release-assets/SHA256SUMS-linux.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Sign update manifest and create incremental chunks
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MEOWLIVE_UPDATE_PRIVATE_KEY: ${{ secrets.MEOWLIVE_UPDATE_PRIVATE_KEY }}
          MEOWLIVE_UPDATE_PUBLIC_KEY: ${{ vars.MEOWLIVE_UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          if [ -z "$MEOWLIVE_UPDATE_PRIVATE_KEY" ] || [ -z "$MEOWLIVE_UPDATE_PUBLIC_KEY" ]; then
            echo '::warning::Update signing is not configured. Publishing manual installer only; App automatic installation remains disabled.'
          else
            node scripts/update-manifest.mjs release-assets
          fi
      - name: Separate update resources and generate platform download links
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-layout.mjs release-assets update-assets "releases/$RELEASE_TAG.md" "$RUNNER_TEMP/release-notes.md"
      - name: Publish platform downloads and separate update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          # Publish all update blocks before exposing the user-facing release.
          if [ -n "$(find update-assets -maxdepth 1 -type f -name 'chunk-*.bin' -print -quit)" ]; then
            update_tag="$RELEASE_TAG-updates-windows-x86_64"
            if ! gh release view "$update_tag" >/dev/null 2>&1; then
              gh release create "$update_tag" --target "$RELEASE_COMMIT" --draft --prerelease --latest=false \
                --title "MeowLive2D $RELEASE_TAG 更新资源（Windows x64）" \
                --notes "供 App 增量更新使用，请勿手动下载。安装包请前往 https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            fi
            find update-assets -maxdepth 1 -type f -name 'chunk-*.bin' -print0 | xargs -0 -n 20 gh release upload --clobber "$update_tag"
            gh release edit "$update_tag" --draft=false --latest=false
          fi
          if [ -n "$(find update-assets/linux-x86_64 -maxdepth 1 -type f -name 'chunk-*.bin' -print -quit 2>/dev/null)" ]; then
            update_tag="$RELEASE_TAG-updates-linux-x86_64"
            if ! gh release view "$update_tag" >/dev/null 2>&1; then
              gh release create "$update_tag" --target "$RELEASE_COMMIT" --draft --prerelease --latest=false \
                --title "MeowLive2D $RELEASE_TAG 更新资源（Linux x86_64）" \
                --notes "供 Linux App 自动更新使用，请勿手动下载。安装包请前往 https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            fi
            find update-assets/linux-x86_64 -maxdepth 1 -type f -name 'chunk-*.bin' -print0 | xargs -0 -n 20 gh release upload --clobber "$update_tag"
            gh release edit "$update_tag" --draft=false --latest=false
          fi
          release_args=(--draft --verify-tag --title "MeowLive2D $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$RELEASE_TAG" == *-windows-preview.* ]]; then release_args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${release_args[@]}"
          # This directory contains installers and small metadata, never chunks.
          find release-assets -maxdepth 1 -type f -print0 | xargs -0 -n 20 gh release upload "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false
