name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json")).version; const tag = process.env.RELEASE_TAG; if (tag !== `v${version}` && !(tag.startsWith(`v${version}-windows-preview.`) && /^\d{8}$/.test(tag.slice(`v${version}-windows-preview.`.length)))) throw new Error("Tag must match Tauri version or its dated Windows preview");'
          test -f "releases/$RELEASE_TAG.md"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-installer
          path: release-assets
      - name: Verify installer checksum
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Sign update manifest and create incremental chunks
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MEOWLIVE_UPDATE_PRIVATE_KEY: ${{ secrets.MEOWLIVE_UPDATE_PRIVATE_KEY }}
          MEOWLIVE_UPDATE_PUBLIC_KEY: ${{ vars.MEOWLIVE_UPDATE_PUBLIC_KEY }}
        shell: bash
        run: |
          if [ -z "$MEOWLIVE_UPDATE_PRIVATE_KEY" ] || [ -z "$MEOWLIVE_UPDATE_PUBLIC_KEY" ]; then
            echo '::warning::Update signing is not configured. Publishing manual installer only; App automatic installation remains disabled.'
          else
            node scripts/update-manifest.mjs release-assets
          fi
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_args=(--draft --verify-tag --title "MeowLive2D $RELEASE_TAG" --notes-file "releases/$RELEASE_TAG.md")
          if [[ "$RELEASE_TAG" == *-windows-preview.* ]]; then release_args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${release_args[@]}"
          # Bound argv and publish only after every installer/chunk/manifest uploaded.
          find release-assets -maxdepth 1 -type f -print0 | xargs -0 -n 20 gh release upload "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false
