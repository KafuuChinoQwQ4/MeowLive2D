# 离线预设样例；端口/模型名必须匹配用户已安装的 OpenAI-compatible 本地服务。
# 配置可用不等于硬件已验证；在面板完成实测后才显示本次验证结果。
[llm]
mode = "local"
base_url = "http://127.0.0.1:8080/v1"
model = "local-quantized-model"
api_key_env = ""
timeout_seconds = 60
max_response_bytes = 65536
max_tokens = 512
json_mode = true
max_retries = 0

[speech]
base_url = "http://127.0.0.1:9880"
reference_audio = ""
max_concurrency = 1
timeout_seconds = 120

[resources]
directory = "../data/resources"

[training]
directory = "../data/training"
