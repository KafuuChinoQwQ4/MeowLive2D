# 可直接启动主服务；复制为 server.local.toml，可在面板上传音色或配置默认参考素材。
[server]
listen_address = "127.0.0.1:19600"
queue_capacity = 8
history_limit = 50
allowed_origins = ["http://127.0.0.1:1420", "http://localhost:1420", "http://tauri.localhost"]

[speech]
base_url = "http://127.0.0.1:9880"
# 引擎可读取的 Linux 参考音频绝对路径；空值会让播报明确失败，不生成假音频。
reference_audio = ""
prompt_text = ""
prompt_language = "zh"
text_language = "zh"
max_concurrency = 1
# 长 SC 留言与回复共用一次合成；WAV 响应上限 32 MiB。
timeout_seconds = 300
max_audio_bytes = 33554432

# Agent 启动时始终暂停；在面板中配置并恢复后才会调用模型。
[agent]
persona = "你是一位友好、自然的 Live2D 主播，用简短中文与观众互动。"
system_prompt = ""
topic = ""
proactive_enabled = false
cooldown_ms = 30000
pending_capacity = 128
history_limit = 200
dedup_capacity = 512
event_ttl_ms = 60000
gift_merge_ms = 3000
batch_size = 8
conversation_limit = 6

# 可在 Agent 互动页保存；最近 60 秒达到任一阈值即繁忙。
[agent.interaction]
chat_read_mode = "auto" # auto / all / selective
welcome_enabled = true
busy_chat_count = 6
busy_enter_count = 3
busy_pending_count = 4
welcome_cooldown_ms = 30000
welcome_viewer_cooldown_ms = 600000

[llm]
mode = "cloud"
# 可在控制面板的“LLM 接入”页配置；本机覆盖文件优先于此处。
provider = "custom"
# openai_chat / openai_responses / anthropic_messages / gemini_generate_content
api_format = "openai_chat"
# API 根地址或完整端点与模型名同时填写；适配器按 api_format 补齐路径。
# 兼容服务可填写 https://提供商/API根路径 或 http://本地服务:端口/v1。
base_url = ""
model = ""
# 这里只写环境变量名，不写密钥。无认证的本地模型须显式设为 ""。
api_key_env = "MEOWLIVE_LLM_API_KEY"
timeout_seconds = 30
max_response_bytes = 65536
max_tokens = 1024
json_mode = true
reasoning_effort = "default" # default / minimal / low / medium / high / xhigh / max / ultra
max_retries = 1

# 官方直播开放平台；默认禁用，配置完成后仍需在面板手动连接。
[live]
enabled = false
app_id = 0
# 仅填写环境变量名，凭据本身由启动主服务的终端提供。
access_key_id_env = "MEOWLIVE_BILIBILI_ACCESS_KEY_ID"
access_key_secret_env = "MEOWLIVE_BILIBILI_ACCESS_KEY_SECRET"
identity_code_env = "MEOWLIVE_BILIBILI_IDENTITY_CODE"
reconnect_initial_ms = 1000
reconnect_max_ms = 30000

[resources]
# 相对本配置文件目录；与 GPT-SoVITS 同机时可直接读取。
directory = "../data/resources"
# 引擎在容器或其他主机时，填共享资源目录在引擎中的 Linux 绝对路径。
# 空字符串使用上面目录的绝对路径；需要共享整个目录及 references 子目录。
engine_directory = ""

# 微调默认关闭。仅在非直播状态、TTS/本地 LLM 停止后运行；训练预设尚需硬件验收。
[training]
enabled = false
directory = "../data/training"
# 启用时填写本机 GPT-SoVITS Python 环境的实际绝对路径。
python = ""
engine_root = ""
# 页面选择优先；未选择时使用此绝对路径，空值优先项目 data/models/faster-whisper-large-v3-turbo，再兼容旧引擎模型。
# 需要 model.bin、config.json、tokenizer.json、preprocessor_config.json；运行时不会下载模型。使用 CPU int8，不占用训练显存。
asr_model = ""
timeout_seconds = 7200
# 只对 scripts/start-managed-inference.py 的独立配置实例设 true。
# 共享的其他 GPT-SoVITS 实例不应启用此项，因为权重接口会写推理配置。
managed_inference = false
default_gpt_weights = ""
default_sovits_weights = ""

# 默认保存观众、事件、陪伴积分和记忆；控制面板用户直接拥有管理权限。
[viewers]
# 相对本 TOML 所在目录；请保持该目录跨重启持久、私有可写。
receipt_directory = "../data/viewer-receipts"
# 日历日边界为固定 UTC 偏移（分钟），默认中国标准时间；不推断主机时区。
calendar_offset_minutes = 480
enabled = true
# 稳定逻辑角色范围；重启、换声音/外观时不要改动。
scope_id = "default-avatar"
database_url_env = "MEOWLIVE_DATABASE_URL"

[auth]
# 单用户控制面板无需登录；仅在另行部署受保护服务时显式开启认证。
enabled = false
admin_token_env = "MEOWLIVE_ADMIN_TOKEN"
device_token_env = "MEOWLIVE_DEVICE_TOKEN"
# 环境变量未提供时读取相对本 TOML 的私有文件，两份凭据必须不同。
# admin_token_file = "local/admin-token.txt"
# device_token_file = "local/device-token.txt"
session_lifetime_seconds = 28800

# PostgreSQL 记忆存储随 [viewers] 默认开启；以下仅控制独立模型的后台提取。
[memory]
enabled = false
endpoint = ""
model = ""
api_key_env = "MEOWLIVE_MEMORY_API_KEY"
embedding_endpoint = ""
embedding_model = ""
embedding_api_key_env = "MEOWLIVE_EMBEDDING_API_KEY"
embedding_dimensions = 384
timeout_ms = 15000

# Neo4j 是可重建副本，故障时用 PostgreSQL 的一跳有效关系。
[graph]
enabled = false
endpoint = "http://127.0.0.1:17474/db/neo4j/query/v2"
user = "neo4j"
password_env = "MEOWLIVE_NEO4J_PASSWORD"
